  - stage: terraform
    displayName: 'Terraform Infra'
    jobs:
      - job: TerraformApply
        displayName: 'TerraformApply'
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: 'terraform'
              backendServiceArm: 'UC-Manual'
              backendAzureRmResourceGroupName: 'credpay'
              backendAzureRmStorageAccountName: 'credpaysa12'
              backendAzureRmContainerName: 'statefulset'
              backendAzureRmKey: 'terraform.tfstate'
              # Fixes 403 authorization error by forcing Azure AD auth
              backendAzureRmUseAzureAD: true

          # - task: TerraformTask@5
          #   displayName: 'Terraform Apply'
          #   inputs:
          #     provider: 'azurerm'
          #     command: 'apply'
          #     workingDirectory: 'terraform'
          #     # Fixes hyphen syntax and prevents interactive prompt hanging
          #     commandOptions: '--auto-approve'
          #     environmentServiceNameAzureRM: 'UC-Manual'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'destroy'
              workingDirectory: 'terraform'
              commandOptions: '--auto-approve'
              environmentServiceNameAzureRM: 'UC-Manual'